services:
  - type: web
    name: fanclub-football
    env: python
    buildCommand: pip install -r requirements.txt && python scripts/init_db.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fanclub-postgres
          property: connectionString

databases:
  - name: fanclub-postgres
    databaseName: fanclub_db
    user: fanclub_user
    plan: free
